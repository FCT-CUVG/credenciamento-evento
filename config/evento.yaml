# Identidade do evento. Coloque logo, decoração e fontes em static/assets/.
name: BRACIS 2026
short_name: BRACIS
registration_hint_en: "Use the full name and email address you entered in SBC's ECOS registration system."
registration_hint_pt: "Use o nome completo e o e-mail informados no ECOS da SBC."
logo: bracis-2026-logo.png
decoration: bracis-tree.svg

fonts:
  body: noto-sans.woff2
  display: bebas-neue.woff2

# Cores em hexadecimal de seis dígitos; mantenha as aspas.
colors:
  primary: "#313267"          # painéis de destaque e títulos
  navigation: "#0a4273"       # navegação e números secundários
  text: "#1c1d3a"             # texto principal
  text_muted: "#5c5d7a"       # texto de apoio
  action: "#32a64f"           # botões e estados positivos
  action_hover: "#25813c"     # hover de ações e destaques
  focus: "#e2c576"            # detalhes e indicador de foco
  page_background: "#f0f2f2"  # fundo da página
  surface: "#ffffff"          # cartões e texto sobre fundo escuro

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Separação de crachás e kits | {{EVENT_NAME}}</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/theme.css">
  <script type="module" src="/js/queue.js"></script>
</head>
<body data-page="volunteer">
  <header class="site-header">
    <a class="site-brand" href="/busca" aria-label="{{EVENT_NAME}} — separação de crachás e kits">
      <img src="{{EVENT_LOGO}}" alt="{{EVENT_NAME}}">
      <span class="site-brand-label">Credenciamento</span>
    </a>
    <nav class="header-right" aria-label="Área da equipe">
      <span id="user-label" class="user-label"></span>
      <div id="team-links" class="team-links"></div>
      <button class="button small secondary" id="logout">Sair</button>
    </nav>
  </header>
  <main>
    <div class="page-heading">
      <div>
        <h1 class="page-title">SEPARAÇÃO DE CRACHÁS E KITS</h1>
        <p>Assuma uma busca antes de separar o material. Depois de deixá-lo no guichê indicado, marque como pronto.</p>
      </div>
    </div>
    <div class="toolbar">
      <input id="queue-filter" class="search-input" type="search" placeholder="Filtrar por nome ou guichê" aria-label="Filtrar fila">
      <span class="muted" id="last-update"></span>
    </div>
    <p id="page-error" class="alert hidden" role="alert"></p>
    <div class="lane-grid">
      <section class="lane"><h2>AGUARDANDO BUSCA <span id="count-prechecked"></span></h2><div class="queue-list" id="lane-prechecked"></div></section>
      <section class="lane searching-lane"><h2>EM BUSCA <span id="count-searching"></span></h2><div class="queue-list" id="lane-searching"></div></section>
      <section class="lane ready-lane"><h2>PRONTO NO GUICHÊ <span id="count-ready"></span></h2><div class="queue-list" id="lane-ready"></div></section>
    </div>
  </main>
  <dialog id="confirm-dialog">
    <h2 id="dialog-title"></h2>
    <p id="dialog-description" class="big"></p>
    <div class="actions"><button class="button secondary" id="dialog-cancel">Cancelar</button><button class="button" id="dialog-confirm">Confirmar</button></div>
  </dialog>
</body>
</html>

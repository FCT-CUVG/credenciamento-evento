<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumo do credenciamento | {{EVENT_NAME}}</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/theme.css">
  <script type="module" src="/js/summary.js"></script>
</head>
<body data-page="summary">
  <main class="summary-main">
    <div class="page-heading">
      <img class="summary-logo" src="{{EVENT_LOGO}}" alt="{{EVENT_NAME}}">
      <h1 class="page-title">CREDENCIAMENTO</h1>
    </div>
    <p id="page-error" class="alert hidden" role="alert"></p>
    <div class="summary-stats">
      <section class="summary-stat"><h2>Inscritos</h2><strong id="stat-total">—</strong></section>
      <section class="summary-stat"><h2>Chegaram ao evento</h2><strong id="stat-arrived">—</strong></section>
      <section class="summary-stat"><h2>Credenciados</h2><strong id="stat-completed">—</strong></section>
    </div>
  </main>
</body>
</html>

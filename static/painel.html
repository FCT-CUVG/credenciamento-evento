<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do credenciamento | BRACIS 2026</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body data-page="dashboard">
  <header class="site-header">
    <a class="site-brand" href="/painel" aria-label="BRACIS 2026 — painel do credenciamento">
      <img src="/assets/bracis-2026-logo.png" alt="BRACIS 2026">
      <span class="site-brand-label">Credenciamento</span>
    </a>
    <nav class="header-right" aria-label="Área da equipe">
      <span id="user-label" class="user-label"></span>
      <div id="team-links" class="team-links"></div>
      <button class="button small secondary" id="logout">Sair</button>
    </nav>
  </header>
  <main>
    <div class="page-heading">
      <div>
        <p class="page-context">Coordenação · BRACIS 2026</p>
        <h1 class="page-title">PAINEL DO CREDENCIAMENTO</h1>
        <p>Acompanhe quem chegou, onde está cada crachá e kit, e os participantes credenciados.</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><strong id="stat-total">—</strong><span>Inscritos</span></div>
      <div class="stat"><strong id="stat-prechecked">—</strong><span>Chegaram ao evento</span></div>
      <div class="stat"><strong id="stat-searching">—</strong><span>Em busca</span></div>
      <div class="stat"><strong id="stat-ready">—</strong><span>Prontos no guichê</span></div>
      <div class="stat"><strong id="stat-completed">—</strong><span>Participantes credenciados</span></div>
    </div>
    <p id="sync-status" class="muted"></p>
    <div class="toolbar">
      <input id="dashboard-filter" class="search-input" type="search" placeholder="Buscar por nome, e-mail ou guichê" aria-label="Filtrar participantes">
      <select id="status-filter" class="search-input" aria-label="Filtrar situação">
        <option value="">Todos os estados</option>
        <option value="registered">Ainda não chegaram</option>
        <option value="prechecked">Pré-check-in</option>
        <option value="searching">Em busca</option>
        <option value="ready">Prontos no guichê</option>
        <option value="completed">Participantes credenciados</option>
      </select>
      <span id="list-count" class="muted"></span>
    </div>
    <p id="page-error" class="alert hidden" role="alert"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>Participante</th><th>E-mail</th><th>Afiliação</th><th>Guichê</th><th>Situação</th><th>Responsável</th></tr></thead>
      <tbody id="dashboard-body"></tbody>
    </table></div>
  </main>
</body>
</html>

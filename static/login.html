<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrada da equipe | BRACIS 2026</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body data-page="login">
  <header class="site-header">
    <a class="site-brand" href="/" aria-label="BRACIS 2026 — início do credenciamento">
      <img src="/assets/bracis-2026-logo.png" alt="BRACIS 2026">
      <span class="site-brand-label">Credenciamento</span>
    </a>
  </header>
  <main class="login-wrap">
    <p class="page-context">Acesso de voluntários, atendentes e coordenação</p>
    <h1>ENTRAR NA EQUIPE</h1>
    <section class="card">
      <form class="form" id="login-form">
        <label class="field">Usuário<input name="username" autocomplete="username" required></label>
        <label class="field">Senha<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button full" type="submit">Entrar</button>
        <p id="login-error" class="alert hidden" role="alert"></p>
      </form>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retirada de crachás e kits | BRACIS 2026</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body data-page="attendant">
  <header class="site-header">
    <a class="site-brand" href="/fila" aria-label="BRACIS 2026 — retirada de crachás e kits">
      <img src="/assets/bracis-2026-logo.png" alt="BRACIS 2026">
      <span class="site-brand-label">Credenciamento</span>
    </a>
    <nav class="header-right" aria-label="Área da equipe">
      <span id="user-label" class="user-label"></span>
      <div id="team-links" class="team-links"></div>
      <button class="button small secondary" id="logout">Sair</button>
    </nav>
  </header>
  <main>
    <div class="page-heading">
      <div>
        <p class="page-context">Atendimento final · BRACIS 2026</p>
        <h1 class="page-title" id="guiche-title">GUICHÊ</h1>
        <p>Confirme a retirada somente depois de entregar o crachá e o kit ao participante.</p>
      </div>
    </div>
    <div class="toolbar">
      <input id="queue-filter" class="search-input" type="search" placeholder="Filtrar pelo nome" aria-label="Filtrar pelo nome">
      <span class="muted" id="last-update"></span>
    </div>
    <p id="page-error" class="alert hidden" role="alert"></p>
    <div class="lane-grid">
      <section class="lane ready-lane"><h2>PRONTOS PARA RETIRADA <span id="count-ready"></span></h2><div class="queue-list" id="lane-ready"></div></section>
      <section class="lane searching-lane"><h2>EM BUSCA <span id="count-searching"></span></h2><div class="queue-list" id="lane-searching"></div></section>
      <section class="lane"><h2>AGUARDANDO BUSCA <span id="count-prechecked"></span></h2><div class="queue-list" id="lane-prechecked"></div></section>
    </div>
  </main>
  <dialog id="confirm-dialog">
    <h2 id="dialog-title"></h2>
    <p id="dialog-description" class="big"></p>
    <div class="actions"><button class="button secondary" id="dialog-cancel">Cancelar</button><button class="button" id="dialog-confirm">Confirmar retirada</button></div>
  </dialog>
</body>
</html>
